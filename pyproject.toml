[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-core-orchestrator"
version = "2.0.0"
description = "Enterprise Multi-Agent Orchestrator with Controlled Self-Evolution & Strict Budget Bounds"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "NEXUS CORE Team", email = "nexus@enterprise.ai"}
]
keywords = [
    "multi-agent",
    "autonomous-agents",
    "self-evolution",
    "llm-orchestrator",
    "fastapi",
    "dag-scheduler",
    "cas-statemachine"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks"
]
dependencies = [
    "fastapi>=0.100.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.6"
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9.0"
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]

[project.scripts]
nexus-cli = "scripts.nexus_cli:main"
nexus-server = "scripts.start_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.html", "*.js", "*.css", "*.svg"]
